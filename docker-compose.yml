services:

  db:
    image: postgres:18
    ports:
      # Só acessível desta máquina (127.0.0.1), nunca da rede externa,
      # mesmo que o firewall do host esteja mal configurado.
      - "127.0.0.1:5432:5432"
    volumes:
      # No Postgres 18, o ponto de montagem é /var/lib/postgresql (e não .../data).
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=iccsite
      - POSTGRES_USER=iccuser
      - POSTGRES_PASSWORD=iccpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iccuser -d iccsite"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Em desenvolvimento usa o servidor do Django, que recarrega ao salvar.
    # setup_dev cria o administrador local e carrega os dados de exemplo
    # quando o banco está vazio.
    command: sh -c "python manage.py migrate && python manage.py setup_dev && python manage.py runserver 0.0.0.0:8000"
    ports:
      # Só acessível desta máquina: o administrador local tem senha conhecida
      # e não pode ficar aberto a outros computadores da rede.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      # Dados reais do ICC (não versionados), lidos pelo import_icc_data.
      - ./site-data:/site-data:ro
    env_file:
      # Opcional. Só é preciso para variáveis extras, como as de um Cloudinary
      # de testes (ver backend/.env.example).
      - path: ./backend/.env
        required: false
    environment:
      # Chave só para desenvolvimento local. Em produção ela vem do painel da
      # hospedagem.
      - SECRET_KEY=chave-apenas-para-desenvolvimento-local
      - DEBUG=True
      - DB_NAME=iccsite
      - DB_USER=iccuser
      - DB_PASSWORD=iccpassword
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: